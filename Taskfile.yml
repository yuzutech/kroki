version: '3'

env:
  TESTS_DIR: 'ci/tests'
  COMPOSE_TIMEOUT: 20
  SERVICES_TIMEOUT: 15

tasks:
  mavenBuild:
    cmds:
      - cmd: "./mvnw --no-transfer-progress clean package"
        platforms: [linux, darwin]
      - cmd: "mvnw.cmd --no-transfer-progress clean package"
        platforms: [windows]

  mavenSetVersion:
    preconditions:
      - sh: "[ '{{.RELEASE_VERSION}}' != '<no value>' ]"
        msg: "RELEASE_VERSION must be defined"
    cmds:
      - './mvnw versions:set -DnewVersion={{.RELEASE_VERSION}}'

  dockerBuildImages:
    cmds:
      # the per-target cache locations are derived from the CACHE_FROM_DIR and CACHE_TO_DIR environment variables in docker-bake.hcl
      - 'docker buildx bake --allow=fs=/tmp kroki companion-images {{if .BUILD_MULTIARCH}}--set "*.platform=linux/arm64,linux/amd64"{{end}}'

  dockerPublishImages:
    preconditions:
      - sh: "[ '{{.RELEASE_VERSION}}' != '<no value>' ]"
        msg: "RELEASE_VERSION must be defined"
    cmds:
      - 'docker buildx bake --allow=fs.write=/tmp -f docker-bake.hcl -f docker-bake-release.hcl kroki companion-images --push --set "*.platform=linux/arm64,linux/amd64"'

  # Used by the release workflow: each platform is built on a native runner and pushed by digest,
  # then dockerMergeImages assembles the digests listed in the metadata files into tagged multi-platform images.
  dockerPushImagesByDigest:
    preconditions:
      - sh: "[ '{{.RELEASE_VERSION}}' != '<no value>' ]"
        msg: "RELEASE_VERSION must be defined"
      - sh: "[ '{{.PLATFORM}}' != '<no value>' ] && [ '{{.METADATA_FILE}}' != '<no value>' ]"
        msg: "PLATFORM and METADATA_FILE must be defined"
    env:
      PUSH_BY_DIGEST: 'true'
    cmds:
      - 'mkdir -p "$(dirname "{{.METADATA_FILE}}")"'
      - 'docker buildx bake -f docker-bake.hcl -f docker-bake-release.hcl kroki companion-images --set "*.platform={{.PLATFORM}}" --metadata-file "{{.METADATA_FILE}}"'

  dockerMergeImages:
    preconditions:
      - sh: "[ '{{.RELEASE_VERSION}}' != '<no value>' ]"
        msg: "RELEASE_VERSION must be defined"
      - sh: "[ '{{.METADATA_DIR}}' != '<no value>' ]"
        msg: "METADATA_DIR must be defined"
    cmds:
      - |
        set -e
        bake=$(docker buildx bake -f docker-bake.hcl -f docker-bake-release.hcl kroki companion-images --print)
        for target in $(echo "$bake" | jq -r '.target | keys[]'); do
          tags=$(echo "$bake" | jq -r --arg t "$target" '.target[$t].tags | map("--tag " + .) | join(" ")')
          repository=$(echo "$bake" | jq -r --arg t "$target" '.target[$t].tags[0] | sub(":[^:]*$"; "")')
          images=$(jq -r --arg t "$target" --arg r "$repository" '"\($r)@\(.[$t]["containerimage.digest"])"' "{{.METADATA_DIR}}"/*.json)
          docker buildx imagetools create $tags $images
        done

  smokeTests:
    cmds:
      - task: smokeTestsBuildImages
      - task: smokeTestsRun

  # Builds the images for the current platform and loads them into the Docker daemon.
  smokeTestsBuildImages:
    env:
      TAG: 'smoketests'
    cmds:
      # the per-target cache locations are derived from the CACHE_FROM_DIR and CACHE_TO_DIR environment variables in docker-bake.hcl
      - 'docker buildx bake --allow=fs=/tmp kroki companion-images --load'

  # Runs the smoke tests against the images loaded by smokeTestsBuildImages.
  smokeTestsRun:
    cmds:
      - 'docker compose --file {{.TESTS_DIR}}/docker-compose.yaml up --build --detach'
      - defer: 'docker compose --file {{.TESTS_DIR}}/docker-compose.yaml stop'
      - 'echo'
      - 'docker compose --file {{.TESTS_DIR}}/docker-compose.yaml ps'
      - 'echo'
      - '{{.TESTS_DIR}}/wait-for-it.sh localhost:8000 --timeout={{.COMPOSE_TIMEOUT}}'
      - 'echo'
      - 'echo "Waiting for the containers services to be available... {{.SERVICES_TIMEOUT}} seconds"'
      - 'sleep {{.SERVICES_TIMEOUT}}'
      - 'npm test'

  denoInstallVega:
    internal: true
    cmds:
      - 'deno install'
    dir: 'deno'
  npmInstall:
    deps: [denoInstallVega]
    cmds:
      - 'npm i --prefix bpmn'
      - 'npm run prestart --prefix bpmn'
      - 'npm i --prefix bytefield'
      - 'npm i --prefix dbml'
      - 'npm i --prefix diagrams.net'
      - 'npm i --prefix excalidraw'
      - 'npm run build --prefix excalidraw'
      - 'npm i --prefix mermaid'
      - 'npm run prestart --prefix mermaid'
      - 'npm i --prefix nomnoml'
      - 'npm i --prefix wavedrom'

  updateVersions:
    cmds:
      - 'node ci/tasks/update-versions.js'
