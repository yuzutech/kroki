name: Release
run-name: Release v${{ inputs.release_version }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        required: true
        type: string
      create_tag:
        description: 'Create a tag'
        required: false
        default: false
        type: boolean
      create_gh_release:
        description: 'Create a GitHub release'
        required: false
        default: false
        type: boolean
      publish_dockerhub:
        description: 'Publish to Docker Hub'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # When create_tag is unchecked, the tag must already exist (retry of a
          # failed release): build from it so the artifacts match the tag even if
          # the branch has moved since.
          ref: ${{ inputs.create_tag && github.ref || format('v{0}', inputs.release_version) }}
      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install graphviz -y
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag, commit and push
        if:  ${{ inputs.create_tag }}
        run: |
          task mavenSetVersion
          node ci/tasks/changelog.js release "$RELEASE_VERSION"

          RELEASE_GIT_NAME=$(curl -s https://api.github.com/users/$GITHUB_ACTOR | jq -r .name)
          RELEASE_GIT_EMAIL=$RELEASE_USER@users.noreply.github.com

          git config --local user.name "$RELEASE_GIT_NAME"
          git config --local user.email "$RELEASE_GIT_EMAIL"

          git commit -a -m "Release $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push origin "$BRANCH_NAME"
          git push origin "v$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      - name: Build Java server
        run: task mavenBuild
      - run: echo "RELEASE_VERSION=v$RELEASE_VERSION" >> $GITHUB_ENV
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - name: Generate checksums
        run: |
          cp kroki-server.jar kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar
          sha512sum kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar > kroki-standalone-server-${{ env.RELEASE_VERSION }}.sha512sum.txt
          md5sum kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar > kroki-standalone-server-${{ env.RELEASE_VERSION }}.md5sum.txt
        working-directory: server/target
      - name: Upload Java server
        if: ${{ inputs.publish_dockerhub }}
        uses: actions/upload-artifact@v7
        with:
          name: kroki-server
          path: server/target/kroki-server.jar
          if-no-files-found: error
          retention-days: 1
      - name: Create release
        if:  ${{ inputs.create_gh_release }}
        run: |
          if ! gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            node ci/tasks/changelog.js notes "${RELEASE_VERSION#v}" > release-notes.md
            gh release create "$RELEASE_VERSION" \
              --title "$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" ./server/target/kroki-standalone-server-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Each platform is built on a native runner (no QEMU emulation) and pushed by digest,
  # then publish_dockerhub merges the digests into tagged multi-platform images.
  build_images:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: release
    if:  ${{ inputs.publish_dockerhub }}
    steps:
      - name: Free up disk space
        shell: bash
        # workaround: https://github.com/jlumbroso/free-disk-space/issues/9
        # copied from https://github.com/hirnidrin/free-disk-space/blob/4bacba7c412c8ace26b87b5b79977da05137e69d/action.yml
        run: |
          # ======
          # MACROS
          # ======
          
          # macro to print a line of equals
          # (silly but works)
          printSeparationLine() {
          str=${1:=}
          num=${2:-80}
          counter=1
          output=""
          while [ $counter -le $num ]
          do
            output="${output}${str}"
            counter=$((counter+1))
          done
          echo "${output}"
          }
          
          # macro to compute available space
          # REF: https://unix.stackexchange.com/a/42049/60849
          # REF: https://stackoverflow.com/a/450821/408734
          getAvailableSpace() { echo $(df -a $1 | awk 'NR > 1 {avail+=$4} END {print avail}'); }
          
          # macro to make Kb human readable (assume the input is Kb)
          # REF: https://unix.stackexchange.com/a/44087/60849
          formatByteCount() { echo $(numfmt --to=iec-i --suffix=B --padding=7 $1'000'); }
          
          # macro to output saved space
          printSavedSpace() {
          saved=${1}
          title=${2:-}
          
          echo ""
          printSeparationLine '*' 80
          if [ ! -z "${title}" ]; then
           echo "=> ${title}: Saved $(formatByteCount $saved)"
          else
           echo "=> Saved $(formatByteCount $saved)"
          fi
          printSeparationLine '*' 80
          echo ""
          }
          
          # macro to print output of dh with caption
          printDH() {
          caption=${1:-}
          
          printSeparationLine '=' 80
          echo "${caption}"
          echo ""
          echo "$ dh -h /"
          echo ""
          df -h /
          echo "$ dh -a /"
          echo ""
          df -a /
          echo "$ dh -a"
          echo ""
          df -a
          printSeparationLine '=' 80
          }
          
          # ======
          # SCRIPT
          # ======
          
          # Display initial disk space stats
          
          AVAILABLE_INITIAL=$(getAvailableSpace)
          AVAILABLE_ROOT_INITIAL=$(getAvailableSpace '/')
          
          printDH "BEFORE CLEAN-UP:"
          echo ""
          
          # Remove Android library
          BEFORE=$(getAvailableSpace)
          
          sudo rm -rf /usr/local/lib/android
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED "Android library"
          
          BEFORE=$(getAvailableSpace)
          
          # https://github.community/t/bigger-github-hosted-runners-disk-space/17267/11
          sudo rm -rf /usr/share/dotnet
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED ".NET runtime"
          
          BEFORE=$(getAvailableSpace)
          
          sudo rm -rf /opt/ghc
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED "Haskell runtime"
          
          # Remove large packages
          # REF: https://github.com/apache/flink/blob/master/tools/azure-pipelines/free_disk_space.sh
          # (the arm64 runner image does not ship all of them, hence the || true)
          
          BEFORE=$(getAvailableSpace)
          
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y '^llvm-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED "Large misc. packages"
          
          # Remove Docker images
          BEFORE=$(getAvailableSpace)
          
          sudo docker image prune --all --force
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED "Docker images"
          
          # Remove Swap storage
          BEFORE=$(getAvailableSpace)
          
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          free -h
          
          AFTER=$(getAvailableSpace)
          SAVED=$((AFTER-BEFORE))
          printSavedSpace $SAVED "Swap storage"
          
          # Output saved space statistic
          
          AVAILABLE_END=$(getAvailableSpace)
          AVAILABLE_ROOT_END=$(getAvailableSpace '/')
          
          echo ""
          printDH "AFTER CLEAN-UP:"
          
          echo ""
          echo ""
          
          echo "/dev/root:"
          printSavedSpace $((AVAILABLE_ROOT_END - AVAILABLE_ROOT_INITIAL))
          echo "overall:"
          printSavedSpace $((AVAILABLE_END - AVAILABLE_INITIAL))
      - run: echo "RELEASE_VERSION=v$RELEASE_VERSION" >> $GITHUB_ENV
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Download Java server
        uses: actions/download-artifact@v8
        with:
          name: kroki-server
          path: server/target
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkitd.toml
      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker images ${{ inputs.release_version }} (${{ matrix.platform }}) by digest
        run: task dockerPushImagesByDigest
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PLATFORM: ${{ matrix.platform }}
          METADATA_FILE: ${{ runner.temp }}/image-metadata/${{ runner.arch }}.json
      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ runner.arch }}
          path: ${{ runner.temp }}/image-metadata/${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 1
  publish_dockerhub:
    runs-on: ubuntu-24.04
    needs: build_images
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.release_version }}
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-metadata-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-metadata
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish Docker images ${{ inputs.release_version }}
        run: task dockerMergeImages
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          METADATA_DIR: ${{ runner.temp }}/image-metadata
