name: Release
run-name: Release v${{ inputs.release_version }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        required: true
        type: string
      create_tag:
        description: 'Create a tag'
        required: false
        default: false
        type: boolean
      create_gh_release:
        description: 'Create a GitHub release'
        required: false
        default: false
        type: boolean
      publish_dockerhub:
        description: 'Publish to Docker Hub'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # When create_tag is unchecked, the tag must already exist (retry of a
          # failed release): build from it so the artifacts match the tag even if
          # the branch has moved since.
          ref: ${{ inputs.create_tag && github.ref || format('v{0}', inputs.release_version) }}
      - name: Install GraphViz
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq --yes graphviz > /dev/null
      - name: Set up the build tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          install_args: java node task
      - name: Tag, commit and push
        if:  ${{ inputs.create_tag }}
        run: |
          task mavenSetVersion
          node ci/tasks/changelog.js release "$RELEASE_VERSION"

          RELEASE_GIT_NAME=$(curl -s https://api.github.com/users/$GITHUB_ACTOR | jq -r .name)
          RELEASE_GIT_EMAIL=$RELEASE_USER@users.noreply.github.com

          git config --local user.name "$RELEASE_GIT_NAME"
          git config --local user.email "$RELEASE_GIT_EMAIL"

          git commit -a -m "Release $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push origin "$BRANCH_NAME"
          git push origin "v$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      - name: Build Java server
        run: task mavenBuild
      - run: echo "RELEASE_VERSION=v$RELEASE_VERSION" >> $GITHUB_ENV
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - name: Generate checksums
        run: |
          cp kroki-server.jar kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar
          sha512sum kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar > kroki-standalone-server-${{ env.RELEASE_VERSION }}.sha512sum.txt
          md5sum kroki-standalone-server-${{ env.RELEASE_VERSION }}.jar > kroki-standalone-server-${{ env.RELEASE_VERSION }}.md5sum.txt
        working-directory: server/target
      - name: Upload Java server
        if: ${{ inputs.publish_dockerhub }}
        uses: actions/upload-artifact@v7
        with:
          name: kroki-server
          path: server/target/kroki-server.jar
          if-no-files-found: error
          retention-days: 1
      - name: Create release
        if:  ${{ inputs.create_gh_release }}
        run: |
          if ! gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            node ci/tasks/changelog.js notes "${RELEASE_VERSION#v}" > release-notes.md
            gh release create "$RELEASE_VERSION" \
              --title "$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" ./server/target/kroki-standalone-server-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Each platform is built on a native runner (no QEMU emulation) and pushed by digest,
  # then publish_dockerhub merges the digests into tagged multi-platform images.
  build_images:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: release
    if:  ${{ inputs.publish_dockerhub }}
    steps:
      - run: echo "RELEASE_VERSION=v$RELEASE_VERSION" >> $GITHUB_ENV
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - name: Download Java server
        uses: actions/download-artifact@v8
        with:
          name: kroki-server
          path: server/target
      - name: Install Task
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          install_args: task
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: 'v0.38.1'
          buildkitd-config: .github/buildkitd.toml
      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker images ${{ inputs.release_version }} (${{ matrix.platform }}) by digest
        run: task dockerPushImagesByDigest
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PLATFORM: ${{ matrix.platform }}
          METADATA_FILE: ${{ runner.temp }}/image-metadata/${{ runner.arch }}.json
      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ runner.arch }}
          path: ${{ runner.temp }}/image-metadata/${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 1
  publish_dockerhub:
    runs-on: ubuntu-24.04
    needs: build_images
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.release_version }}
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-metadata-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-metadata
      - name: Install Task
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          install_args: task
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: 'v0.38.1'
      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish Docker images ${{ inputs.release_version }}
        run: task dockerMergeImages
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          METADATA_DIR: ${{ runner.temp }}/image-metadata
