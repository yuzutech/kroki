name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - '*'
  workflow_call:
    inputs:
      test_arm64:
        description: Also build and test the images on a native arm64 runner
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  test-containers:
    # The nightly build also runs on a native arm64 runner (no QEMU emulation), like the release workflow.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.test_arm64 && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    
    - name: Install GraphViz
      run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq --yes graphviz > /dev/null

    - name: Set up the build tools
      uses: jdx/mise-action@v5
      with:
        version: 2026.10.23
        install_args: java node task

    - name: Build Java server
      run: task mavenBuild

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: 'v0.38.1'
        buildkitd-config: .github/buildkitd.toml

    # BuildKit uses the GitHub Actions cache API directly (cache type=gha, see docker-bake.hcl),
    # but only JavaScript actions receive its URL and token: expose them to the next steps.
    - name: Expose the GitHub Actions cache API
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL)
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

    # Only the pushes on main write the cache: the pull requests and the nightly build read it
    # but do not write their own, otherwise the caches would exceed the repository quota.
    # One cache scope per architecture: the nightly arm64 job does not find any cache.
    - name: Build container images
      run: task smokeTestsBuildImages
      env:
        GHA_CACHE_SCOPE: buildx-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        GHA_CACHE_WRITE: ${{ github.event_name == 'push' }}

    - name: Install Node dependencies
      run: npm install

    - name: Run smoke tests
      run: task smokeTestsRun
