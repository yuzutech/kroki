name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - '*'
  workflow_call:
    inputs:
      build_multiarch:
        description: Also build and test the images on a native arm64 runner
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  test-containers:
    # The nightly build also runs on a native arm64 runner (no QEMU emulation), like the release workflow.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.build_multiarch && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    
    - name: Install GraphViz
      run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq --yes graphviz > /dev/null

    - name: Set up the build tools
      uses: jdx/mise-action@v5
      with:
        version: 2026.10.23
        install_args: java node task

    - name: Build Java server
      run: task mavenBuild

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: 'v0.38.1'
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 2

    # Only the pushes on main save the cache (an amd64 one): the pull requests and the nightly build
    # restore it but do not save their own, otherwise the caches would exceed the repository quota.
    # One cache per architecture: restoring the cache of the other architecture would miss every layer,
    # so the nightly arm64 job does not find any cache.
    - name: Restore Docker layers cache
      uses: actions/cache/restore@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-

    - name: Build container images
      run: task smokeTestsBuildImages
      env:
        # one cache subdirectory per bake target, see docker-bake.hcl
        CACHE_FROM_DIR: '/tmp/.buildx-cache'
        CACHE_TO_DIR: ${{ github.event_name == 'push' && '/tmp/.buildx-cache-new' || '' }}

    - name: Install Node dependencies
      run: npm install

    - name: Run smoke tests
      run: task smokeTestsRun

    # The exported cache replaces the restored one, otherwise the cache would grow forever.
    # https://github.com/docker/build-push-action/issues/252
    # https://github.com/moby/buildkit/issues/1896
    - name: Replace Docker layers cache
      if: ${{ github.event_name == 'push' }}
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Save Docker layers cache
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-${{ github.sha }}
