name: Mermaid CI

on:
  push:
    paths:
      - 'mermaid/**'
      - 'lib/**'
    branches:
      - main
  pull_request:
    paths:
      - 'mermaid/**'
      - 'lib/**'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  mermaid-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          install_args: node
      - name: Install dependencies
        run: npm i
        working-directory: mermaid
      - name: Install Chrome for Puppeteer
        run: |
          rm -rf ~/.cache/puppeteer/chrome
          npx puppeteer browsers install chrome
        working-directory: mermaid
      - name: Lint & tests
        run: npm run lint && npm t
        working-directory: mermaid
      # The library has no dependencies of its own (its node_modules would end
      # up in the "lib" Docker build context): lint it with Mermaid's Biome.
      - name: Lint & test the shared browser-instance library
        run: npm run lint && npm t
        working-directory: lib/browser-instance
