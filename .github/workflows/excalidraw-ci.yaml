name: Excalidraw CI

on:
  push:
    paths:
      - 'excalidraw/**'
      - 'lib/**'
    branches:
      - main
  pull_request:
    paths:
      - 'excalidraw/**'
      - 'lib/**'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  excalidraw-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          install_args: node
      # The tests stub the browser: Chrome is not needed.
      - name: Install dependencies
        run: npm i
        working-directory: excalidraw
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Lint & tests
        run: npm run lint && npm t
        working-directory: excalidraw
