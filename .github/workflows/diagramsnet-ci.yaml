name: diagrams.net CI

on:
  push:
    paths:
      - 'diagrams.net/**'
      - 'lib/**'
    branches:
      - main
  pull_request:
    paths:
      - 'diagrams.net/**'
      - 'lib/**'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  diagramsnet-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup Node.js 24'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm i
        working-directory: diagrams.net
      - name: Install Chrome for Puppeteer
        run: |
          rm -rf ~/.cache/puppeteer/chrome
          npx puppeteer browsers install chrome
        working-directory: diagrams.net
      - name: Lint & tests
        run: npm run lint && npm t
        working-directory: diagrams.net
