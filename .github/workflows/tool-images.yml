name: Tool images
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish {0} {1} by {2}', inputs.tool, inputs.version, github.actor) || 'Tool images' }}

# Tools that rarely change and only provide a binary to the Kroki image (see tools/)
# are built on demand and published as ghcr.io/yuzutech/kroki-builder-<tool>:<version>,
# so that building and releasing Kroki only copies the published binary.
#
# The image is published:
# - by running this workflow manually (workflow_dispatch), which replaces the image if the version is already published
# - from a Renovate pull request that updates the version of a tool, when this version is not published yet:
#   the same pull request updates the FROM instruction of the Kroki Dockerfile (see renovate.json5),
#   so its "CI" run fails until the image is published, and is re-run once it is
on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool'
        required: true
        type: choice
        options:
          - blockdiag
          - ditaa
          - erd
          - graphviz
          - pikchr
          - symbolator
          - umlet
          - wireviz
      version:
        description: 'Tool version (upstream release)'
        required: true
        type: string
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tool-images.yml'

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # [{"name": "<tool>", "version": "<version>", "publish": true|false}]
      tools: ${{ steps.tools.outputs.tools }}
      publish: ${{ steps.tools.outputs.publish }}
    steps:
      # on pull requests, only build and test the tools whose directory changed (every tool when this workflow changed),
      # with the version set in their Dockerfile
      - name: List the tools to build
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Renovate branches only: other pull requests use the manual workflow to publish
          CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tools=$(jq -cn --arg name "$TOOL" --arg version "$VERSION" '[{name: $name, version: $version, publish: true}]')
          else
            all=$(gh api "repos/$REPO/contents/tools?ref=$HEAD_SHA" --jq '.[] | select(.type == "dir") | .name')
            changed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if grep -qx '.github/workflows/tool-images.yml' <<< "$changed"; then
              names=$all
            else
              # ignore the tools that were removed
              names=$(grep -Fxf <(sed -nE 's|^tools/([^/]+)/.*|\1|p' <<< "$changed" | sort -u) <<< "$all" || true)
            fi
            tools='[]'
            for name in $names; do
              version=$(gh api "repos/$REPO/contents/tools/$name/Dockerfile?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' \
                | sed -nE 's/^ARG VERSION=(\S+)$/\1/p')
              publish=false
              if [[ "$CAN_PUBLISH" == 'true' ]]; then
                # publish only when the registry says that this version does not exist (404): never replace an image
                token=$(curl -fsSL "https://ghcr.io/token?scope=repository:yuzutech/kroki-builder-$name:pull" | jq -r .token)
                status=$(curl -sS -o /dev/null -w '%{http_code}' --head -H "Authorization: Bearer $token" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                  "https://ghcr.io/v2/yuzutech/kroki-builder-$name/manifests/$version")
                case "$status" in
                  200) echo "$name $version is already published" ;;
                  404) publish=true ;;
                  *) echo "::warning::Unable to check whether $name $version is published (HTTP $status), it will not be published" ;;
                esac
              fi
              tools=$(jq -c --arg name "$name" --arg version "$version" --argjson publish "$publish" \
                '. + [{name: $name, version: $version, publish: $publish}]' <<< "$tools")
            done
          fi
          echo "Tools to build: $tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "publish=$(jq -c 'map(select(.publish))' <<< "$tools")" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.tool.name }}, ${{ matrix.platform }})
    needs: tools
    if: needs.tools.outputs.tools != '[]'
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.tools) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TOOL: ${{ matrix.tool.name }}
      VERSION: ${{ matrix.tool.version }}
      PUBLISH: ${{ matrix.tool.publish }}
      IMAGE: ghcr.io/yuzutech/kroki-builder-${{ matrix.tool.name }}
    steps:
      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: 'v0.38.2'
          driver-opts: image=moby/buildkit:v0.34.2
      - name: Test the binary
        run: docker buildx build --target test --build-arg "VERSION=$VERSION" "tools/$TOOL"
      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image by digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/image-metadata"
          docker buildx build --build-arg "VERSION=$VERSION" \
            --label org.opencontainers.image.source=https://github.com/yuzutech/kroki \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/image-metadata/$RUNNER_ARCH.json" \
            "tools/$TOOL"
      - name: Upload the image digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ matrix.tool.name }}-${{ runner.arch }}
          path: ${{ runner.temp }}/image-metadata/${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 1
  publish:
    name: publish (${{ matrix.tool.name }} ${{ matrix.tool.version }})
    needs: [tools, build]
    if: needs.tools.outputs.publish != '[]'
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.tools.outputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ matrix.tool.version }}
      IMAGE: ghcr.io/yuzutech/kroki-builder-${{ matrix.tool.name }}
    steps:
      - name: Download the image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-metadata-${{ matrix.tool.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-metadata
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: 'v0.38.2'
          driver-opts: image=moby/buildkit:v0.34.2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform image
        run: |
          mapfile -t images < <(jq -r --arg image "$IMAGE" '"\($image)@\(.["containerimage.digest"])"' "$RUNNER_TEMP"/image-metadata/*.json)
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.source=https://github.com/yuzutech/kroki" \
            "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
  # the "CI" run of the pull request failed to build the Kroki image while the tool image was not published yet:
  # re-run it now that it is
  rerun-ci:
    needs: publish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-run the failed jobs of the CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow main.yaml --branch "$HEAD_REF" --event pull_request --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No CI run for $HEAD_REF"
            exit 0
          fi
          # wait for the run to complete: its jobs can only be re-run once it is
          gh run watch "$run_id" --repo "$REPO" --interval 30 > /dev/null || true
          conclusion=$(gh run view "$run_id" --repo "$REPO" --json conclusion --jq .conclusion)
          if [[ "$conclusion" == 'failure' ]]; then
            echo "Re-running the failed jobs of https://github.com/$REPO/actions/runs/$run_id"
            gh run rerun "$run_id" --repo "$REPO" --failed
          else
            echo "CI run https://github.com/$REPO/actions/runs/$run_id: $conclusion, nothing to re-run"
          fi
