actdiagGet:
  get:
    tags:
    - Diagram conversion
    operationId: getActdiagDiagram
    summary: Convert an Actdiag diagram with a GET request
    description: The source is zlib-wrapped deflate data encoded with base64 and URL-encoded.
    parameters:
    - $ref: ../../common/parameters.yaml#/OutputFormat
    - $ref: ../../common/parameters.yaml#/SourceEncoded
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
actdiagPost:
  post:
    tags:
    - Diagram conversion
    operationId: postActdiagDiagram
    summary: Convert an Actdiag diagram
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
actdiagPostFormat:
  parameters:
  - $ref: ../../common/parameters.yaml#/OutputFormat
  post:
    tags:
    - Diagram conversion
    operationId: postActdiagDiagramInFormat
    summary: Convert an Actdiag diagram to a selected format
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
