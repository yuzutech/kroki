ditaaGet:
  get:
    tags:
    - Diagram conversion
    operationId: getDitaaDiagram
    summary: Convert a Ditaa diagram with a GET request
    description: The source is zlib-wrapped deflate data encoded with base64 and URL-encoded.
    parameters:
    - $ref: ../../common/parameters.yaml#/OutputFormat
    - $ref: ../../common/parameters.yaml#/SourceEncoded
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
ditaaPost:
  post:
    tags:
    - Diagram conversion
    operationId: postDitaaDiagram
    summary: Convert a Ditaa diagram
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
ditaaPostFormat:
  parameters:
  - $ref: ../../common/parameters.yaml#/OutputFormat
  post:
    tags:
    - Diagram conversion
    operationId: postDitaaDiagramInFormat
    summary: Convert a Ditaa diagram to a selected format
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
