plantumlGet:
  get:
    tags:
    - Diagram conversion
    operationId: getPlantumlDiagram
    summary: Convert a PlantUML diagram with a GET request
    description: The source is zlib-wrapped deflate data encoded with base64 and URL-encoded.
    parameters:
    - $ref: ../../common/parameters.yaml#/OutputFormat
    - $ref: ../../common/parameters.yaml#/SourceEncoded
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
plantumlPost:
  post:
    tags:
    - Diagram conversion
    operationId: postPlantumlDiagram
    summary: Convert a PlantUML diagram
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
plantumlPostFormat:
  parameters:
  - $ref: ../../common/parameters.yaml#/OutputFormat
  post:
    tags:
    - Diagram conversion
    operationId: postPlantumlDiagramInFormat
    summary: Convert a PlantUML diagram to a selected format
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
