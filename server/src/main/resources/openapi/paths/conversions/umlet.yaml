umletGet:
  get:
    tags:
    - Diagram conversion
    operationId: getUmletDiagram
    summary: Convert a UMLet diagram with a GET request
    description: The source is zlib-wrapped deflate data encoded with base64 and URL-encoded.
    parameters:
    - $ref: ../../common/parameters.yaml#/OutputFormat
    - $ref: ../../common/parameters.yaml#/SourceEncoded
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
umletPost:
  post:
    tags:
    - Diagram conversion
    operationId: postUmletDiagram
    summary: Convert a UMLet diagram
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
umletPostFormat:
  parameters:
  - $ref: ../../common/parameters.yaml#/OutputFormat
  post:
    tags:
    - Diagram conversion
    operationId: postUmletDiagramInFormat
    summary: Convert a UMLet diagram to a selected format
    requestBody:
      $ref: ../../common/requestBodies.yaml#/DiagramInput
    responses:
      '200':
        $ref: ../../common/responses.yaml#/RenderedDiagram
      default:
        $ref: ../../common/responses.yaml#/Error
