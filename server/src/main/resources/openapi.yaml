  # Runtime companion routes, mounted only when companion discovery is enabled and safe mode permits it.
  /services:
    post:
      tags: [Companion services]
      operationId: registerCompanionService
      summary: Register a companion diagram service
      description: |
        Registers a new diagram type and mounts its conversion routes until it is unregistered
        or its heartbeat expires. This endpoint is disabled by default and in SECURE safe mode.
        If a registration token is configured, send it as a bearer token. The host must be
        reachable by Kroki and must not be a literal private, loopback, or link-local address.
      parameters:
        - $ref: '#/components/parameters/CompanionAuthorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionRegistrationRequest'
            example:
              name: mscgen
              version: 0.20.0
              formats: [svg, png]
              host: mscgen
              port: 8080
      responses:
        '201':
          description: The companion service was registered.
          headers:
            Location:
              description: URL of the registration resource.
              schema:
                type: string
                example: /services/mscgen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionRegistration'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Missing or invalid bearer token when token authentication is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '422':
          description: The requested diagram type name is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Companion services]
      operationId: listCompanionServices
      summary: List registered companion services
      description: Returns an empty array when no companion services are registered.
      parameters:
        - $ref: '#/components/parameters/CompanionAuthorization'
      responses:
        '200':
          description: The current companion service registrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanionRegistration'
        '401':
          description: Missing or invalid bearer token when token authentication is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        default:
          $ref: '#/components/responses/Error'

  /services/{name}/heartbeat:
    put:
      tags: [Companion services]
      operationId: heartbeatCompanionService
      summary: Refresh a companion service heartbeat
      description: Updates the registration activity time and prevents TTL-based eviction.
      parameters:
        - $ref: '#/components/parameters/CompanionName'
        - $ref: '#/components/parameters/CompanionAuthorization'
      responses:
        '200':
          description: The updated registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionRegistration'
        '401':
          description: Missing or invalid bearer token when token authentication is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          description: The companion is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatNotFound'
        default:
          $ref: '#/components/responses/Error'

  /services/{name}:
    parameters:
      - $ref: '#/components/parameters/CompanionName'
      - $ref: '#/components/parameters/CompanionAuthorization'
    get:
      tags: [Companion services]
      operationId: getCompanionService
      summary: Get a companion service registration
      responses:
        '200':
          description: The requested registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionRegistration'
        '401':
          description: Missing or invalid bearer token when token authentication is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Companion services]
      operationId: unregisterCompanionService
      summary: Unregister a companion service
      description: Removes the registration and its diagram conversion routes immediately.
      responses:
        '204':
          description: The registration was removed.
        '401':
          description: Missing or invalid bearer token when token authentication is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  # The root path has both operations; POST is registered before the operations endpoints,
  # and GET is registered after the Swagger routes.
  /:
    post:
      tags: [Diagram conversion]
      operationId: convertDiagram
      summary: Convert a diagram using the JSON API
      description: |
        Converts a diagram selected by diagram_type. The service must be registered and support
        the requested output_format. diagram_options are passed to that diagram service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramRestRequest'
            example:
              diagram_type: graphviz
              output_format: svg
              diagram_source: 'digraph G { Hello -> World }'
              diagram_options: {}
      responses:
        '200':
          $ref: '#/components/responses/RenderedDiagram'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Operations]
      operationId: getHomePage
      summary: Get the Kroki home page
      responses:
        '200':
          description: The HTML home page with registered diagram service versions.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Get Prometheus metrics
      description: Exposes Kroki worker-thread and event-loop blocked-thread percentages.
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP kroki_worker_thread_blocked_percentage The percentage of worker thread blocked.
                # TYPE kroki_worker_thread_blocked_percentage gauge
                kroki_worker_thread_blocked_percentage 0 1730815200000
        default:
          $ref: '#/components/responses/Error'

  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Get Kroki health and service versions
      responses:
        '200':
          $ref: '#/components/responses/Health'
        default:
          $ref: '#/components/responses/Error'

  /v1/health:
    get:
      tags: [Operations]
      operationId: getVersionedHealth
      summary: Get Kroki health and service versions
      description: Versioned alias of GET /health.
      responses:
        '200':
          $ref: '#/components/responses/Health'
        default:
          $ref: '#/components/responses/Error'

  /healthz:
    get:
      tags: [Operations]
      operationId: getHealthz
      summary: Get Kroki liveness status
      description: Kubernetes liveness-probe alias of GET /health.
      responses:
        '200':
          $ref: '#/components/responses/Health'
        default:
          $ref: '#/components/responses/Error'

  /swagger:
    get:
      tags: [Operations]
      operationId: getSwaggerUi
      summary: Get the Swagger UI page
      responses:
        '200':
          description: Swagger UI HTML. The page loads its pinned UI assets from unpkg.com.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /openapi.yaml:
    get:
      tags: [Operations]
      operationId: getOpenApiSpecification
      summary: Get this OpenAPI specification
      responses:
        '200':
          description: OpenAPI document in YAML format.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    OutputFormat:
      name: output_format
      in: path
      required: true
      description: |
        Requested output format. Valid formats are png, svg, jpeg, pdf, base64, txt, and utxt;
        each diagram service supports only a subset. Unsupported formats return 400.
      schema:
        type: string
        enum: [png, svg, jpeg, pdf, base64, txt, utxt]
    SourceEncoded:
      name: source_encoded
      in: path
      required: true
      description: Diagram source compressed with zlib-wrapped deflate, base64-encoded, then URL-encoded.
      schema:
        type: string
    CompanionName:
      name: name
      in: path
      required: true
      description: Registered companion service name.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]{1,31}$'
        minLength: 2
        maxLength: 32
    CompanionAuthorization:
      name: Authorization
      in: header
      required: false
      description: |
        Use the Bearer scheme with the configured registration token when token authentication
        is enabled by the operator. Omit this header when token authentication is not configured.
      schema:
        type: string
        example: Bearer token

  requestBodies:
    DiagramInput:
      required: true
      description: |
        Submit plain diagram text, selecting the output format with the path parameter or Accept
        header; or submit JSON with diagram_source, optional diagram_options and optional
        output_format. For JSON, a path output_format takes precedence over the body field.
        When no output_format is provided in the path or JSON body, Accept must select a format
        supported by the diagram service.
        Diagram options may also be supplied as query parameters or in
        Kroki-Diagram-Options-* headers. Body diagram_options take precedence over those values.
      content:
        text/plain:
          schema:
            type: string
          example: 'digraph G { Hello -> World }'
        application/json:
          schema:
            $ref: '#/components/schemas/DiagramPostRequest'
  responses:
    RenderedDiagram:
      description: Rendered diagram. The actual media type is determined by the selected format.
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
        text/plain; charset=utf-8:
          schema:
            type: string
        text/plain; charset=x-user-defined:
          schema:
            type: string
        image/svg+xml:
          schema:
            type: string
            format: binary
          description: Error image when the client requests SVG.
        image/png:
          schema:
            type: string
            format: binary
          description: Error image when the client requests PNG.
    Health:
      description: Kroki is running and reports its registered service versions.
      content:
        application/health+json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    Error:
      description: |
        Error response. The body representation is negotiated from Accept and can be JSON,
        plain text, or HTML. The status code reflects the failure (commonly 400, 404, 405, 422,
        500, or 503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string

  schemas:
    DiagramPostRequest:
      type: object
      required: [diagram_source]
      properties:
        diagram_source:
          type: string
          minLength: 1
          description: Source text for the diagram.
        output_format:
          type: string
          enum: [png, svg, jpeg, pdf, base64, txt, utxt]
          description: Optional output format; defaults to the Accept header if omitted.
        diagram_options:
          type: object
          description: Diagram-service-specific options.
          additionalProperties: true
      additionalProperties: true
    DiagramRestRequest:
      type: object
      required: [diagram_type, output_format, diagram_source]
      properties:
        diagram_type:
          type: string
          minLength: 1
          description: Built-in or currently registered diagram type (for example graphviz).
        output_format:
          type: string
          enum: [png, svg, jpeg, pdf, base64, txt, utxt]
          description: Must be supported by the selected diagram type.
        diagram_source:
          type: string
          minLength: 1
          description: Source text for the diagram.
        diagram_options:
          type: object
          description: Diagram-service-specific options.
          additionalProperties: true
      additionalProperties: true
    CompanionRegistrationRequest:
      type: object
      required: [name, version, formats, host, port]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9]{1,31}$'
          minLength: 2
          maxLength: 32
          description: Unique lowercase service name. Reserved and already registered names are rejected.
        version:
          type: string
          minLength: 1
          description: Free-form service version, included in health and home-page service listings.
        formats:
          type: array
          minItems: 1
          items:
            type: string
            enum: [png, svg, jpeg, pdf, base64, txt, utxt]
          description: Output formats supported by the companion.
        host:
          type: string
          minLength: 1
          description: Companion hostname or address reachable from Kroki; private, loopback, and link-local IP literals are rejected.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Companion HTTP port.
      additionalProperties: false
    CompanionRegistration:
      type: object
      required: [name, version, formats, created_at, updated_at, last_activity_at]
      properties:
        name:
          type: string
        version:
          type: string
        formats:
          type: array
          items:
            type: string
            enum: [png, svg, jpeg, pdf, base64, txt, utxt]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
      additionalProperties: false
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [pass]
        version:
          type: object
          required: [kroki]
          properties:
            kroki:
              type: object
              required: [number, build_hash]
              properties:
                number:
                  type: string
                build_hash:
                  type: string
              additionalProperties: false
          additionalProperties:
            type: string
          description: Additional properties map registered diagram-service names to versions.
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
          additionalProperties: false
        stack:
          type: array
          items:
            type: string
          description: Included only when exception details are enabled by the operator.
      additionalProperties: false
    AuthenticationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Missing or invalid bearer token.
      additionalProperties: false
    HeartbeatNotFound:
      type: object
      required: [error, _links]
      properties:
        error:
          type: string
        _links:
          type: object
          required: [register]
          properties:
            register:
              type: object
              required: [href, method]
              properties:
                href:
                  type: string
                  example: /services
                method:
                  type: string
                  enum: [POST]
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
