openapi: 3.0.3
info:
  title: Kroki API
  version: 0.34.0
  description: |
    HTTP API for converting diagram descriptions to rendered output.

    Diagram conversion routes are registered for the built-in diagram types below. Their
    supported output formats vary by type; unsupported formats return 400. Companion diagram
    types can add the same three route shapes at runtime when companion discovery is enabled.
    The registry and conversion routes for those types exist only while the companion remains
    registered.

    The companion-management API is disabled by default and is unavailable in SECURE safe mode.
    When KROKI_COMPANION_REGISTRATION_TOKEN is configured, every /services request requires
    Authorization: Bearer <token>. Expose this API only on a trusted network.
  contact:
    name: Kroki
    url: https://kroki.io
  license:
    name: MIT
    url: https://github.com/yuzutech/kroki/blob/main/LICENSE
servers:
  - url: /
    description: Current Kroki server
tags:
  - name: Diagram conversion
    description: Convert diagrams using a built-in or registered diagram service.
  - name: Companion services
    description: Optional runtime registration API for trusted companion services.
  - name: Operations
    description: Health, metrics, and web documentation endpoints.

x-dynamic-companion-conversion-routes:
  description: |
    Successful POST /services registration adds the following routes under the registered
    service name. These are represented as this extension because a generic OpenAPI path
    parameter would collide with fixed paths such as /health and /services/{name}.
  routes:
    - method: GET
      path: /{name}/{output_format}/{source_encoded}
      description: GET conversion route; source encoding and response behavior match the built-in routes.
    - method: POST
      path: /{name}
      description: POST conversion route; accepts text/plain or application/json.
    - method: POST
      path: /{name}/{output_format}
      description: POST conversion route with the output format in the path.
x-default-route:
  method: any
  path: /*
  description: Requests not matched by a registered endpoint fail with 404.

paths:
  # Routes are listed in the same service-registration order as Server.start().
  /plantuml/{output_format}/{source_encoded}:
    get:
      tags: [Diagram conversion]
      operationId: getPlantumlDiagram
      summary: Convert a PlantUML diagram with a GET request
      description: The source is zlib-wrapped deflate data encoded with base64 and URL-encoded.
      parameters:
        - $ref: '#/components/parameters/OutputFormat'
        - $ref: '#/components/parameters/SourceEncoded'
      responses:
        '200':
          $ref: '#/components/responses/RenderedDiagram'
        default:
          $ref: '#/components/responses/Error'
  /plantuml:
    post:
      tags: [Diagram conversion]
      operationId: postPlantumlDiagram
      summary: Convert a PlantUML diagram
